<script>
  // Profile image hover effect
  const profileImage = document.querySelector(".profile-image");
  if (profileImage) {
    profileImage.addEventListener("mouseenter", function () {
      this.src = "assets/img/profile-img-look.png";
    });

    profileImage.addEventListener("mouseleave", function () {
      this.src = "assets/img/profile-img.png";
    });
  }

  // Make navigation links conditional based on current page
  function updateNavigationLinks() {
    const currentPath = window.location.pathname;
    const currentFile = currentPath.split("/").pop();
    const isIndexPage =
      currentFile === "index.html" ||
      currentFile === "" ||
      currentPath.endsWith("/");

    console.log("Current path:", currentPath);
    console.log("Current file:", currentFile);
    console.log("Is index page:", isIndexPage);

    const navLinks = document.querySelectorAll(".nav-link");
    navLinks.forEach((link) => {
      const href = link.getAttribute("href");
      if (href && href.startsWith("#")) {
        // If not on index page, link to index.html with anchor
        if (!isIndexPage) {
          link.setAttribute("href", "index.html" + href);
          console.log("Updated link:", href, "to:", "index.html" + href);
        } else {
          console.log("Keeping link as is:", href);
        }
      }
    });
  }

  // Run immediately and also on DOMContentLoaded for safety
  updateNavigationLinks();
  document.addEventListener("DOMContentLoaded", updateNavigationLinks);
</script>
